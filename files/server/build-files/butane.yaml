# https://coreos.github.io/butane/examples/
variant: fcos
version: 1.1.0
passwd:
  users:
    - name: a
      # If ssh_authorized_keys_local: The file paths are relative to the directory specified with the --files-dir command-line option, which must be provided.
      ssh_authorized_keys:
        - ssh-rsa  AsusLaptop
        - ssh-rsa  DellDesktop
        - ssh-rsa  PixelPhone
      home_dir: /home/a
      # no_create_home: true
      groups:
        - wheel
        - plugdev
        - docker
      shell: /bin/bash
  
