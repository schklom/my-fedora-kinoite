modules:
  - type: dnf
    remove:
      packages:
        - noopenh264 # Pointless for now in Fedora 40: https://discussion.fedoraproject.org/t/h264-video-playback-in-firefox-in-f40/111872

    
  # Needed to install mozilla-openh264
  # Thanks to https://discussion.fedoraproject.org/t/fedora-cisco-openh264-repo-does-not-work/100570/10
  - type: dnf
    repos:
      cleanup: true # clean up added repos after module is done
      nonfree: negativo17
    install:
      packages:
        - mozilla-openh264
