modules:
  - type: rpm-ostree
    install:
      - distrobox # run any os in containers easily
      - htop # Better "top"
      - podman-compose # Use docker.compose.yml files with podman
      - plasma-workspace-x11 # Fedora decided to remove X11, so I have to add it back
      - xbindkeys # Shortcuts
      - rclone
      - rclone-browser
      - duf # Better "df"
      - doublecmd-qt6 # Better file manager, and works with rclone mounts (to test) (https://doublecmd.sourceforge.io/)
      - chkrootkit

      # Trivalent https://github.com/secureblue/Trivalent (Vanadium for desktop)
      - trivalent
      - mullvad-vpn

      # KDE
      - kdepim-addons # For the Event Calendar widget, to work with external calendars
      - kde-connect
      - kdeconnectd
      - kontact # Calendar + Contact + Task manager. If installed via Flatpak, it will not work with Event Calendar.
      - pim-data-exporter
      - konsole
      - plasma-browser-integration # https://community.kde.org/Plasma/Browser_Integration
      - kde-partitionmanager
      - plasma-discover # Discover
      - PackageKit # needed for discover
      - network-manager-applet # To customize MAC address randomization with a GUI

      # KeePass
      - mono-complete
      - xdotool
      - xinput

      # Speech-to-text (https://github.com/ideasman42/nerd-dictation)
      # parec is not available
      - sox

      # Media
      # Read DVDs (https://itsfoss.com/play-dvd-fedora/)
      - libdvdcss # From repository (pre-installed) fedora-multimedia or (newest version) rpmfusion-free-release-tainted
      - gwenview # It often fails to open files as a flatpak

      # Text to speech
      - espeak-ng
      - xsel

      # Beep
      # - beep

      # Backup
      - btrfs-assistant # (pre-installed on Bazzite)

      # Mozilla/Cisco openh264
      # Ensure openh264 is available for all softwares (https://fedoraproject.org/wiki/OpenH264)
      - gstreamer1-plugin-openh264
      - openh264
      - mozilla-openh264
      - ffmpeg
      # - ffmpeg-free # free or not, can't have both

    remove:
      # example: removing firefox (in favor of the flatpak)
      # "firefox" is the main package, "firefox-langpacks" is a dependency
      - firefox
      - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
      - noopenh264 # Pointless for now in Fedora 40: https://discussion.fedoraproject.org/t/h264-video-playback-in-firefox-in-f40/111872

