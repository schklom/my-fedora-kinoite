# image will be published to ghcr.io/<user>/<name>
name: my-fedora-kinoite-asus-nvidia
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
# https://github.com/orgs/ublue-os/packages
#base-image: ghcr.io/ublue-os/kinoite-nvidia
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest # 40, or latest is also supported if you want new updates ASAP. stable only for bazzite

## https://github.com/blue-build/base-images/blob/main/recipes/fedora-kinoite-nvidia-latest.yml
#base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia
#image-version: latest # 40, or latest is also supported if you want new updates ASAP. stable only for bazzite

# https://github.com/secureblue/secureblue
# base-image: ghcr.io/secureblue/kinoite-asus-nvidia-userns-hardened
# base-image: ghcr.io/ublue-os/bazzite-asus-nvidia
#image-version: latest # 40, or latest is also supported if you want new updates ASAP. stable only for bazzite

# module configuration, executed in order
# you can include multiple instances of the same module
# https://blue-build.org/learn/getting-started/
modules:

  # Nvidia drivers for Asus are no longer prebuilt
  # https://blue-build.org/reference/modules/akmods
  - type: akmods
    base: main
    # nvidia : for the old nvidia propietary driver, compatible with Maxwell and newer cards (but not Blackwell)
    # nvidia-open : for the new kernel-open driver, to be used in Turing and newer cards
    nvidia-driver: nvidia
    install: [] # empty list = no extra kmods

  # https://blue-build.org/reference/modules/kargs/
  # sudo rpm-ostree kargs --append-if-missing=nvidia-drm.modeset=1 --append-if-missing=modprobe.blacklist=nouveau,nova_core --append-if-missing=rd.driver.blacklist=nouveau,nova_core --append-if-missing=vconsole.keymap=fr
  # `cat /boot/loader/entries/*.conf` -> static boot loader configuration entries that define potential boot options before boot.
  # `cat /proc/cmdline` -> real-time kernel command line used by the running kernel after boot
  # New kargs: rpm-ostree kargs
  # /usr/lib/bootc/kargs.d/* -> bootc kernel arguments from below
  - type: kargs
    kargs:
      # https://rpmfusion.org/Howto/NVIDIA#OSTree_.28Silverblue.2FKinoite.2Fetc.29
      - rd.driver.blacklist=nouveau,nova_core
      - modprobe.blacklist=nouveau,nova_core
      # ujust -n configure-nvidia
      - nvidia-drm.modeset=1

      # Keyboard
      # https://github.com/fedora-silverblue/issue-tracker/issues/3
      - vconsole.keymap=fr

  - from-file: common-repos.yml
  - from-file: common-packages.yml
  - from-file: common-flatpaks.yml
  - from-file: common-systemd.yml
  - from-file: common-extra-modules.yml
  - from-file: desktop-dotfiles.yml
  - from-file: usbguard.yml
  - from-file: common-intel-drivers.yml
  
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/lukenukem/asus-linux/repo/fedora-%OS_VERSION%/lukenukem-asus-linux-fedora-%OS_VERSION%.repo
    install:
      # - nvidia-vaapi-driver # https://fedoraproject.org/wiki/Firefox_Hardware_acceleration#Video_decoding
      # https://github.com/ublue-os/hwe/blob/main/nvidia-install.sh
      - asusctl
      - supergfxctl

  # supergfxctl-plasmoid is crashing due to version issues with libplasma. try later to uncomment it
  ## Found repo from kinoite-asus-nvidia via "rpm -qi supergfxctl-plasmoid"
  #- type: rpm-ostree
  #  repos:
  #    - https://copr.fedorainfracloud.org/coprs/jhyub/supergfxctl-plasmoid/repo/fedora-%OS_VERSION%/jhyub-supergfxctl-plasmoid-fedora-%OS_VERSION%.repo
  #  install:
  #    # https://github.com/ublue-os/hwe/blob/main/nvidia-install.sh
  #    - supergfxctl-plasmoid
  
  - type: systemd
    system:
      enabled:
        - asusd.service
        - supergfxd.service

  # Thermal sensors and fan control
  - type: rpm-ostree
    install:
      - lm_sensors
      - xsensors # GUI for lm_sensors
      #- fancontrol-gui
      #- fancontrol-gui-plasmoid # KDE Plasma widget for fancontrol

  - type: files
    files:
      - source: root_laptop
        destination: /

  - type: script
    scripts:
      - install-libdvdcss.sh # run files/scripts/install-libdvdcss.sh

  # because of akmods
  - type: initramfs
