# image will be published to ghcr.io/<user>/<name>
name: my-fedora-server
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
# https://github.com/orgs/ublue-os/packages
base-image: quay.io/fedora/fedora-coreos
image-version: stable
# https://github.com/secureblue/secureblue
# base-image: ghcr.io/secureblue/kinoite-main-userns-hardened
# base-image: ghcr.io/ublue-os/bazzite
# image-version: stable # 40, or latest is also supported if you want new updates ASAP

# https://blue-build.org/learn/getting-started/
modules:

  # https://blue-build.org/reference/modules/kargs/
  - type: kargs
    kargs:
      # Keyboard
      # https://github.com/fedora-silverblue/issue-tracker/issues/3
      - vconsole.keymap=no

  # - from-file: undo-bazzite-crap.yml
  #- from-file: common-repos.yml
  #- from-file: common-packages.yml
  - type: signing

  - type: files
    files:
      - source: server/root
        destination: /

  # Remove the message of the day reminder to use OCI
  - type: systemd
    system:
      disabled:
        - coreos-oci-migration-motd.service

  # https://github.com/ublue-os/ucore?tab=readme-ov-file#ucore-minimal
  - type: rpm-ostree
    install:
      # https://github.com/ublue-os/ucore/blob/a770b0894c7d1f3edf04b3302e360f03ba621bcf/ucore/install-ucore-minimal.sh#L84C20-L84C41
      - intel-compute-runtime
      # crontab
      - cronie
      - cronie-anacron

  # https://github.com/gsauthof/dracut-sshd
  # SSH into server before the main OS has fully booted (for LUKS)
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/gsauthof/dracut-sshd/repo/fedora-%OS_VERSION%/gsauthof-dracut-sshd-fedora-%OS_VERSION%.repo
    keys:
      - https://download.copr.fedorainfracloud.org/results/gsauthof/dracut-sshd/pubkey.gpg
    install:
      - dracut-sshd
      - systemd-networkd
      - dracut-network

  # Docker
  - type: rpm-ostree
    remove:
      - podman
      - podman-docker
  # Setup Docker CE and remove moby-engine (https://docs.fedoraproject.org/en-US/fedora-coreos/docker-ce/)
  - type: rpm-ostree
    repos:
      - https://download.docker.com/linux/fedora/docker-ce.repo
    keys:
      - https://download.docker.com/linux/fedora/gpg # MAYBE NOT NEEDED
    remove:
      - moby-engine
      - containerd
      - runc
      - docker-cli
    install:
      - docker-ce
      # https://docs.docker.com/engine/install/fedora/#install-using-the-repository
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      # Rootless https://docs.docker.com/engine/security/rootless/
      - newuidmap
      - newgidmap
      - fuse-overlayfs
  # https://docs.docker.com/engine/security/rootless/
  - type: systemd
    system:
      disabled:
        - docker.service
        - docker.socket

  # MAYBE NOT NEEDED
  #- type: rpm-ostree
  #  install:
  #    - mesa-libGL
  #    - mesa-vulkan-drivers
  #    - mesa-dri-drivers
  #    - rocm-opencl-runtime
  #    - rocm-opencl


  - type: initramfs
